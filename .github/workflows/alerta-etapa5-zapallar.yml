name: Alerta Etapa 5 Fundo Zapallar

on:
  schedule:
    # Cada hora. El script solo revisa a las 08:00, 16:00 y 23:00 de Chile.
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Revisar Etapa N°5
        env:
          WES_SMTP_PASSWORD: ${{ secrets.WES_SMTP_PASSWORD }}
        run: python revisar_alerta_etapa5_zapallar.py --programado
